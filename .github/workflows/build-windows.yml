name: build-windows-installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller tkinterdnd2 anthropic
      - run: python -m PyInstaller --noconfirm --windowed --name AIFolderOrganizer --collect-all tkinterdnd2 app_main.py
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss'
      - uses: actions/upload-artifact@v4
        with: { name: AIFolderOrganizer-Setup, path: installer/Output/AIFolderOrganizer-Setup.exe }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: installer/Output/AIFolderOrganizer-Setup.exe }
